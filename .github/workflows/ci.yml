name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.9
      - run: ruff check .
      - run: ruff format --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要看到 tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      # 数据文件必须打进 wheel，否则 import zhihu_cli 会崩
      - name: Smoke-test packaged data files
        run: |
          pip install --no-deps dist/*.whl
          python -c "from zhihu_cli.prompts import AGORA_VOTE_SYSTEM_PROMPT; from zhihu_cli.nlp_tools import STOP_WORDS; print('data files OK')"
