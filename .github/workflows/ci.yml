name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.9
      - run: ruff check .
      - run: ruff format --check .
      # 仓库里的 registry 清单只存占位版本；真实版本由 publish-mcp.yml 在发版时
      # 从 tag 派生并重写，写死一个具体版本号只会随时间失效
      - name: server.json keeps the placeholder version
        run: |
          python - <<'EOF'
          import json, pathlib
          data = json.loads(pathlib.Path("packages/zhihu-mcp/server.json").read_text(encoding="utf-8"))
          versions = {data["version"], data["packages"][0]["version"]}
          assert versions == {"0.0.0"}, f"server.json must keep the placeholder 0.0.0, found {sorted(versions)}"
          print("server.json placeholder OK")
          EOF

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要看到 tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[test]"
      # Live tests are collected and skipped without --live, so this is offline.
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要看到 tags
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      # 数据文件必须打进 wheel，否则装出来的包 import 即崩（用 zipfile 直接查，
      # 不 import 包本身——那会拉重依赖，还测不准）
      - name: Verify data files are in the wheel
        run: |
          python - <<'EOF'
          import glob, os, zipfile
          w = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(w).namelist())
          # 期望包内路径 = 本地对应目录下实际的数据文件，
          # 不硬编码文件名，加/改/删数据文件无需动这里
          expected = set()
          for sub, pattern in (
              ("prompts", "*.txt"),
              ("nlp_tools", "*.txt"),
              ("font_reference", "*.bin"),
              ("font_reference", "*.json"),
          ):
              for src in glob.glob(f"src/zhihu_cli/{sub}/{pattern}"):
                  expected.add(f"zhihu_cli/{sub}/{os.path.basename(src)}")
          missing = expected - names
          assert not missing, f"wheel 缺失数据文件: {missing}"
          print(f"data files OK ({len(names)} 个文件)")
          EOF
