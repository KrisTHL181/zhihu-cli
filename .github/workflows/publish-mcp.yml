name: publish-mcp

# Separate from publish.yml on purpose: the zhihu-mcp alias must never be able
# to block a zhihu-toolkit release, and vice versa.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to publish (e.g. 0.3.1). Required for a manual run: a
          dispatch has no tag, so setuptools-scm would otherwise derive a
          pre-release such as 0.3.1.dev24, which pip and uvx skip by default.
        required: true
        type: string

permissions:
  contents: read       # 检出仓库
  id-token: write      # PyPI trusted publishing + MCP Registry 的 github-oidc 认证

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zhihu-mcp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要看到 tags 来派生版本号
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - name: Build
        # A workflow_dispatch run has no tag to derive a version from, so the
        # caller supplies one. It is passed through env rather than interpolated
        # into the script, and exported (not written to GITHUB_ENV) because
        # GITHUB_ENV only affects later steps, not the build below.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "manual run: publishing as $INPUT_VERSION"
            export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_ZHIHU_MCP="$INPUT_VERSION"
          fi
          python -m build
      - name: Sync server.json version
        # setuptools-scm derives the version from the tag, so the registry
        # manifest in the repo carries the placeholder 0.0.0 instead of a real
        # release number: `mcp-publisher` rejects a version that does not exist
        # on PyPI, and a hardcoded one goes stale silently. Rewrite both fields
        # from the wheel name rather than importing setuptools-scm, which is
        # only a build requirement and is not installed in this step.
        run: |
          VERSION=$(ls dist/*.whl | sed -E 's/.*zhihu_mcp-([^-]+)-py3.*/\1/')
          if [ -z "$VERSION" ]; then
            echo "could not read the version from dist/*.whl" >&2
            exit 1
          fi
          echo "registry manifest version: $VERSION"
          python - "$VERSION" <<'PY'
          import json, pathlib, sys
          version = sys.argv[1]
          if version == "0.0.0":
              sys.exit("refusing to publish the registry manifest with the placeholder version 0.0.0")
          path = pathlib.Path("server.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = version
          data["packages"][0]["version"] = version
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/zhihu-mcp/dist
          attestations: true   # SLSA 签名，需要 id-token: write
      - name: Upload registry manifest
        # Kept as the manual fallback: if the registry publish below fails, the
        # artifact carries the same rewritten manifest and can be published by
        # hand. It is uploaded first so a registry outage cannot lose it.
        uses: actions/upload-artifact@v4
        with:
          name: mcp-registry-manifest
          path: packages/zhihu-mcp/server.json
      - name: Wait for PyPI to list the new version
        # The registry verifies that packages[0].version exists on PyPI, and the
        # JSON API can lag the upload by a few seconds. Poll before publishing
        # rather than letting a transient 404 fail the release.
        run: |
          VERSION=$(python -c "import json; print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 24); do
            if curl -fsS "https://pypi.org/pypi/zhihu-mcp/$VERSION/json" >/dev/null; then
              echo "PyPI lists zhihu-mcp $VERSION"
              exit 0
            fi
            echo "waiting for PyPI to list $VERSION ($i/24)…"
            sleep 5
          done
          echo "PyPI did not list $VERSION within 120s" >&2
          exit 1
      - name: Install mcp-publisher
        env:
          # Pinned rather than 'latest' so a broken upstream release cannot take
          # this workflow down silently; bump deliberately when needed.
          MCP_PUBLISHER_VERSION: v1.8.6
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate the registry manifest
        run: ./mcp-publisher validate
      - name: Authenticate to the MCP Registry
        # Keyless: the workflow's OIDC token proves ownership of the
        # io.github.KrisTHL181 namespace, so no PAT secret is required.
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        # The registry is still in preview; a failure here turns the job red but
        # the PyPI release and the manifest artifact above are already done.
        run: ./mcp-publisher publish
