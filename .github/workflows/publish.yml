name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write      # 创建 GitHub Release
  id-token: write      # 向 PyPI 做 trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools-scm 需要看到 tags 来派生版本号
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true   # SLSA 签名，需要 id-token: write
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.whl \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
