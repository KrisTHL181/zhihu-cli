[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zhihu-toolkit"
dynamic = ["version"]
description = "Zhihu scraper and Markdown conversion utilities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["zhihu", "scraper", "cli", "markdown", "downloader", "api"]
authors = [
    { name = "KrisTHL181", email = "KrisTHL181@outlook.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click",
    "curl-cffi",
    "lxml",
    "cssselect",
    "pyyaml",
    "rich",
    "aiomqtt",
    "textual>=2.0",
    "qrcode",
    "Pillow",
]

[project.optional-dependencies]
classifier = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "scikit-learn>=1.0.0",
    "jieba",
    "networkx",
    "numpy",
]
nlp = [
    "jieba",
    "matplotlib",
    "numpy",
    "pandas",
    "plotly",
    "scikit-learn",
    "wordcloud",
    "networkx",
]
creator = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "seaborn",
]
notify = [
    "desktop-notifier",
]

[project.scripts]
zhihu = "zhihu_cli.main:main"

[project.urls]
Homepage = "https://github.com/KrisTHL181/zhihu-cli"
Repository = "https://github.com/KrisTHL181/zhihu-cli"
Issues = "https://github.com/KrisTHL181/zhihu-cli/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zhihu_cli = ["prompts/*.txt", "nlp_tools/*.txt"]

[tool.setuptools_scm]
fallback_version = "0.1.0"
# PyPI 禁止 local version（+gHASH.dDATE），去掉本地段；打 tag 的版本不受影响
local_scheme = "no-local-version"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
